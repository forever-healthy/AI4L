# Project-scoped MCP server configuration for AI4L-dev
# This takes precedence over .mcp.json and allows custom timeouts for slow Docker-based servers.

[mcp_servers.d-browser]
command = "docker"
args = [
  "run",
  "--rm",
  "-i",
  "--init",
  "--shm-size=2gb",
  "--cap-add=SYS_ADMIN",
  "-e",
  "HEADLESS=true",
  "mcr.microsoft.com/playwright/mcp:latest"
]
enabled = true
startup_timeout_sec = 180   # Playwright browser image is heavy; allow time for first pull + start
tool_timeout_sec = 180

[mcp_servers.d-clinicaltrialsgov]
command = "docker"
args = [
  "run",
  "--rm",
  "-i",
  "--network=host",
  "-e",
  "MCP_TRANSPORT_TYPE=stdio",
  "-e",
  "MCP_LOG_LEVEL=info",
  "ghcr.io/cyanheads/clinicaltrialsgov-mcp-server:latest"
]
enabled = true
startup_timeout_sec = 120
tool_timeout_sec = 90

[mcp_servers.d-pubmed]
command = "docker"
args = [
  "run",
  "--rm",
  "-i",
  "--network=host",
  "-e",
  "MCP_TRANSPORT_TYPE=stdio",
  "-e",
  "MCP_LOG_LEVEL=info",
  "--env-file",
  ".env",
  "ghcr.io/cyanheads/pubmed-mcp-server:latest"
]
enabled = true
startup_timeout_sec = 120
tool_timeout_sec = 90

[mcp_servers.d-fetch]
command = "docker"
args = [
  "run",
  "-i",
  "--rm",
  "mcp/fetch",
  "--ignore-robots-txt",
  "--user-agent=Chrome/145.0.7632.160"
]
enabled = true
startup_timeout_sec = 90
tool_timeout_sec = 60

[mcp_servers.d-proxy-1]
command = "docker"
args = [
  "run",
  "--rm",
  "-i",
  "--env-file",
  ".env",
  "-e",
  "GROUPS=browser",
  "node:22-alpine",
  "sh",
  "-c",
  "API_TOKEN=$BRIGHTDATA_API_TOKEN exec npx -y @brightdata/mcp"
]
enabled = true
startup_timeout_sec = 180   # npx downloads the package on cold start
tool_timeout_sec = 180
